  "Правила",
  "§a1. Игровой процесс:\n§e1.1 §fЗапрещено использовать любые виды программного обеспечения, дающие вам преимущество - блокировка навсегда.\n§e1.2 §fЗапрещено использование любых прокси, VPN - блокировка навсегда. §7(могут быть исключения)\n§e1.3 §fОтказ от проверки на использование запрещённого программного обеспечения приводит к блокировке навсегда.\n§e1.4 §fЗапрещено использовать баги сервера/клиента, дающие вам преимущество перед другими игроками - блокировка на 1 день.\n§e1.5 §fЗапрещён тим на аренах - кик §7(1/3)§f, далее - блокировка на 1 день.\n§e1.6 §fЗапрещено передавать/продавать свой аккаунт третьим лицам - блокировка навсегда и снятие привилегии.\n§e1.7 §fЗапрещено вмешиваться в чужую игру - кик §7(1/3)§f, далее - блокировка на 1 день.\n§e1.8 §fПользовательские 4D модели §7(не из магазина)§f, которые больше/меньше стандартной - кик, далее - блокировка на 1 день.\n§e1.9 §fНекорректные или заведомо ложные жалобы запрещены - кик, далее - блокировка на 1 день.\n§e1.10 §fЗапрещены некорректные (оскорбительные) ники — блокировка навсегда.\n§e1.11 §fЗапрещено ударять игрока и намеренно бегать от него по всей карте - кик §7(1/3)§f, далее - бан на 1 день.\n\n§a2. Игровой чат:\n§e2.1 §fЗапрещено оскорблять других игроков §7(L, ez и подобные не учитываются) §f- кик §7(1/3)§f, далее - блокировка чата на 1 день.\n§e2.2 §fЗапрещено оскорблять администрацию сервера §7(L, ez и подобные не учитываются) §f- блокировка чата на 2 дня.\n§e2.3 §fЗапрещено угнетение по национальности человека - блокировка чата на 1 день.\n§e2.4 §fЗапрещено спамить/флудить - блокировка чата на 1 день.\n§e2.5 §fЗапрещено рекламировать сторонние сервера - блокировка чата навсегда.\n§e2.6 §fЗапрещено оскорблять проект - блокировка чата на 1 неделю.\n\n§eПокупка разблокировки: §aoldtralia.ru",
